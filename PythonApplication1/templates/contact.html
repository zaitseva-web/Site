<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <!--styles-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{url_for('home') }}">Home</a>
        <a href="{{url_for('about') }}">About</a>
        <a href="{{url_for('contact') }}">Contact</a>
        <a href="{{url_for('lists') }}">Lists</a>

        {% if username %}
        <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
    </nav>

    <!-- block of account in the corner -->
    <div style='position: absolute; top:15px; right: 20px; font-weight: bold;'>
        Account: {{ username }}
    </div>

    <h1>Contact Us</h1>


    <!--if message was sent successfully-->
    {% if messadge_statuse %}
    <p style="color: green;">{{ messadge_statuse }}</p>
    {% endif %}
    <!--form sent data method POST-->
    <form method="POST" action="{{ url_for('contact') }}">
        
        <label>Message:</label>
        <textarea name="message" required></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>
</body>
</html>
